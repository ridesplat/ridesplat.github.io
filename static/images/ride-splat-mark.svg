      <stop offset="0" stop-color="#75d7e8" stop-opacity="0.84"/>
      <stop offset="0.5" stop-color="#84b8eb" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ad8cf4" stop-opacity="0.84"/>
